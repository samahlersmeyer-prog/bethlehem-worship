name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 9 * * *'   # nightly, ~4–5am Fort Wayne time: refresh calendar feed + This Sunday
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check church-year calendar
        run: node tests/calendar.test.mjs
      - name: Build calendar feed and This Sunday data
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm install --no-audit --no-fund && node build-feeds.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bethlehem-worship
