<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bethlehem Worship Planner</title>
<style>
  :root {
    --bg: #f6f2ea; --card: #fffdf8; --ink: #2a2622; --muted: #8a8177; --line: #e4ddd0;
    --accent: #6e2b2b; --accent2: #2f4f8f; --warn: #a1661b; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  header { background: #2a2622; color: #f3ede2; padding: 14px 20px 0; position: sticky; top: 0; z-index: 5; }
  header .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
  header h1 { font: 600 20px/1.2 var(--serif); margin: 0; letter-spacing: .2px; }
  header h1 small { display: block; font: 12px var(--sans); color: #bdb3a4; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
  #mode { margin-left: auto; font-size: 13px; color: #d8cfc1; }
  nav.tabs { display: flex; gap: 4px; max-width: 1100px; margin: 10px auto 0; }
  nav.tabs button { background: none; border: 0; color: #bdb3a4; padding: 8px 14px; font: 500 14px var(--sans); border-bottom: 3px solid transparent; cursor: pointer; }
  nav.tabs button.on { color: #fff; border-color: #c9a45c; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  .pad { padding: 14px 16px; }
  .center { text-align: center; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .yrinfo { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  .toolbar select, .toolbar input { width: auto; min-width: 220px; }
  button { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #c9bfae; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: #9b2222; }
  button.link { background: none; border: 0; color: var(--accent2); padding: 2px 4px; }
  button.icon { padding: 2px 7px; border-radius: 5px; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #4a433b; color: #f3ede2; }
  .badge.warn { background: #fbecd2; color: var(--warn); margin-left: 8px; }
  .muted { color: var(--muted); }
  h3.season { font: 600 13px var(--sans); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
  .list .row { display: grid; grid-template-columns: 12px 170px 1fr 180px 110px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .list .row:first-child { border-top: 0; }
  .list a.row:hover { background: #faf6ee; }
  .row.feast { background: #fbf9f4; }
  .row.feast .what b { font-weight: 500; font-style: italic; }
  .row.next { box-shadow: inset 3px 0 0 #c9a45c; }
  .row .swatch { width: 12px; height: 34px; border-radius: 3px; border: 1px solid rgba(0,0,0,.12); }
  .row .when { font-size: 13px; color: #5b544c; font-variant-numeric: tabular-nums; }
  .row .what b { font: 600 15px var(--serif); display: block; }
  .row .what small { display: block; color: var(--muted); font-size: 12.5px; }
  .row .what small.fest { color: var(--accent); }
  .row .sermon { font: italic 14px var(--serif); color: #4a433b; }
  .row .status { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 12px; }
  .row.static { grid-template-columns: 110px 1fr 2fr; }
  .uses a { color: var(--accent2); font-size: 13px; margin-right: 8px; white-space: nowrap; }
  .meter { width: 70px; height: 6px; background: #ece5d8; border-radius: 3px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: #6b8f5e; }
  i.flag { font-style: normal; background: var(--warn); color: #fff; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
  .dayhead { border-left: 8px solid var(--lc); padding: 4px 0 10px 14px; margin-bottom: 14px; }
  .dayhead h2 { font: 600 26px/1.2 var(--serif); margin: 6px 0 4px; }
  .dayhead .meta { color: #5b544c; }
  .colorname { text-transform: capitalize; }
  .crumbs { display: flex; gap: 14px; font-size: 14px; }
  .crumbs a { color: var(--accent2); text-decoration: none; }
  .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 > .card { margin-bottom: 0; }
  .grid2 + .card { margin-top: 14px; }
  .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rd { display: grid; grid-template-columns: 105px 1fr; gap: 8px; padding: 4px 0; align-items: center; }
  .rd span { color: var(--muted); font-size: 13px; }
  .rd b { font: 500 15px var(--serif); }
  details { margin-top: 8px; font-size: 14px; } summary { cursor: pointer; color: var(--accent2); }
  ul.lnotes { margin: 10px 0 0; padding: 10px 0 0 18px; border-top: 1px dashed var(--line); color: #5b544c; font-size: 13.5px; }
  .fld { display: block; margin: 8px 0; } .fld span, .lbl { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  b.sub { display: block; margin-top: 14px; }
  .svc { display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 6px; margin: 6px 0; }
  .slots .slot { display: grid; grid-template-columns: 190px 1fr 1fr auto; gap: 6px; padding: 4px 0; border-bottom: 1px solid #f1ece2; }
  .slot .sl { font-weight: 600; background: #faf7f1; }
  .slot .ops { display: flex; gap: 2px; }
  .slot .warn { grid-column: 2 / -1; font-size: 12px; color: var(--warn); }
  .flags { background: #fdf5e6; border-color: #efd9b1; padding: 12px 16px; }
  .flagrow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 6px 0; border-top: 1px solid #f1e3c6; font-size: 14px; }
  .flagrow:first-of-type { border-top: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border-radius: 99px; } .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 20; }
  .modal .card { width: min(420px, 92vw); }
  .linkrow { display: flex; gap: 8px; max-width: 440px; margin: 8px auto 0; }
  .linkrow button { white-space: nowrap; }
  .moved { color: var(--warn); font-size: 12.5px; }
  .row .what small.moved { color: var(--warn); }
  .obsrow { padding: 10px 16px; } .obsrow .chips { align-items: center; }
  .obsrow input.obsdate { width: auto; }
  .lockbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 16px; background: #eef3ea; border-color: #cfdcc6; }
  .hotd { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; }
  .hotd .lbl { margin-bottom: 4px; }
  details.lastcycle, details.history { margin-top: 10px; font-size: 13.5px; }
  details.history div { padding: 2px 0; }
  table.vol, table.series, table.report { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  table.vol th, table.series th, table.report th { text-align: left; font: 600 12px var(--sans); color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
  table.vol td, table.series td, table.report td { padding: 4px 6px; border-bottom: 1px solid #f1ece2; vertical-align: top; }
  table.vol td:first-child { font-weight: 600; width: 170px; }
  table.series td.tx { font-size: 13px; color: #5b544c; width: 22%; }
  table.series a { color: var(--ink); text-decoration: none; } table.series a:hover { color: var(--accent2); }
  table.series input, table.series textarea { width: 100%; }
  select.copyfrom { width: auto; max-width: 260px; font-size: 13px; padding: 3px 6px; }
  i.lock { font-style: normal; font-size: 12px; }
  .linkrow.wide { max-width: none; }
  .toolbar label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .toolbar label input { width: auto; }
  .hymnal .hrow { grid-template-columns: 90px 1fr 200px auto; }
  .hymnal .hrow .ops button { font-size: 13px; padding: 4px 10px; white-space: nowrap; }
  .hymnal .hrow .uses a, .hymnal .hrow .uses span { font-size: 12.5px; }
  p.or { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
  #printsheet { display: none; }
  @media (max-width: 760px) {
    .list .row { grid-template-columns: 10px 1fr; }
    .list .row .when { grid-column: 2; } .list .row .what { grid-column: 2; }
    .list .row .sermon, .list .row .status { grid-column: 2; justify-content: flex-start; }
    .row .swatch { grid-row: 1 / span 4; height: 100%; }
    .grid2 { grid-template-columns: 1fr; }
    .slots .slot { grid-template-columns: 1fr 1fr; }
    .slot .sv { grid-column: 1 / -1; grid-row: 2; } .slot .sn { grid-column: 1 / -1; }
    .toolbar select, .toolbar input { min-width: 0; width: 100%; }
    table.vol td:first-child { width: auto; } table.series td.tx { display: none; }
    nav.tabs { overflow-x: auto; }
    .hymnal .hrow { grid-template-columns: 70px 1fr; } .hymnal .hrow .uses, .hymnal .hrow .ops { grid-column: 2; }
  }
  @media print {
    header, main, .modal { display: none !important; }
    body { background: #fff; }
    #printsheet { display: block; font: 12pt/1.4 var(--serif); padding: 0 12mm; }
    #printsheet h1 { font-size: 20pt; margin: 0 0 4pt; }
    #printsheet table { width: 100%; border-collapse: collapse; margin: 10pt 0; }
    #printsheet td { border-bottom: 1px solid #ccc; padding: 4pt 6pt; vertical-align: top; }
    #printsheet td:first-child { width: 32%; font-weight: 600; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><small>Bethlehem Lutheran Church · Fort Wayne</small>Worship Planner</h1>
    <div id="mode"></div>
  </div>
  <nav class="tabs"><button data-view="calendar" class="on">Church Year</button><button data-view="series">Sermon Series</button><button data-view="hymns">Hymns</button><button data-view="reports">Reports</button></nav>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<script src="firebase-config.js?v=5"></script>
<script src="js/lectionary.js?v=5"></script>
<script src="js/hymns.js?v=5"></script>
<script src="js/calendar.js?v=5"></script>
<script src="js/seed.js?v=5"></script>
<script src="js/store.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
